<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Fair Photo Booth</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy: #1a1a2e;
  --maroon: #3d0c11;
  --gold: #e8a838;
  --cream: #f5f0e8;
  --warm-white: #faf6ef;
  --strip-bg: #ffffff;
  --shutter-red: #c0392b;
  --accent-pink: #e84393;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Courier New', Courier, monospace;
  color: #7B2D26;
  background: #d5cfc4;
}

/* Background texture - set by JS */
body {
  background-size: 400px 400px;
  background-repeat: repeat;
}


/* ── Screens ── */
.screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.4s ease;
}
.screen.is-active { opacity: 1; pointer-events: auto; }

/* ── Welcome ── */
#welcomeScreen { gap: 24px; text-align: center; padding: 20px; }

.welcome-banner {
  max-width: min(700px, 90vw);
  filter: none;
}

.marquee-subtitle {
  font-size: 1.1rem;
  color: #000;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.marquee-bulbs {
  display: flex; gap: 12px;
  justify-content: center;
}
.marquee-bulbs .bulb {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--gold);
  animation: bulb-blink 1.5s ease-in-out infinite alternate;
}
.marquee-bulbs .bulb:nth-child(2n) { animation-delay: 0.3s; }
.marquee-bulbs .bulb:nth-child(3n) { animation-delay: 0.6s; }

@keyframes bulb-blink {
  0%, 40% { opacity: 0.3; box-shadow: none; }
  60%, 100% { opacity: 1; box-shadow: 0 0 8px var(--gold); }
}

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 14px 40px;
  border: 3px solid #7B2D26;
  border-radius: 8px;
  background: #E8C47A;
  color: #7B2D26;
  font-family: Georgia, serif;
  font-size: 1.3rem;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: all 0.2s ease;
  text-transform: uppercase;
  box-shadow: 3px 3px 0 #7B2D26;
}
.btn:hover {
  background: #F3D48B;
  transform: translate(-1px, -1px);
  box-shadow: 4px 4px 0 #7B2D26;
}
.btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #7B2D26; }

.btn--solid {
  background: #C44B3F;
  color: #F5F0E8;
  border-color: #7B2D26;
}
.btn--solid:hover {
  background: #D45A4E;
}
.btn--small {
  padding: 10px 24px;
  font-size: 0.95rem;
  box-shadow: 2px 2px 0 #7B2D26;
}

/* ── Camera ── */
#cameraScreen { gap: 0; background: #000; }

.camera-viewport {
  position: fixed;
  inset: 24px;
  overflow: hidden;
  background: #000;
  border-radius: 16px;
}
.camera-viewport video {
  width: 100%; height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
  filter: contrast(1.05) saturate(1.1) sepia(0.08);
}
.camera-viewport .countdown-display {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: Georgia, serif;
  font-size: 8rem; font-weight: bold;
  color: white;
  text-shadow: 0 0 40px rgba(0,0,0,0.7);
  opacity: 0; transition: opacity 0.15s;
  pointer-events: none;
}
.camera-viewport .countdown-display.visible { opacity: 1; }
.camera-viewport .flash-overlay {
  position: absolute; inset: 0;
  background: rgba(255,255,255,0.95);
  opacity: 0; pointer-events: none;
  transition: opacity 0.08s;
}
.camera-viewport .flash-overlay.flash { opacity: 1; }

.camera-controls {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 20px;
  z-index: 10;
}

.photo-counter {
  font-size: 1rem;
  color: rgba(245,240,232,0.8);
  letter-spacing: 0.1em;
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}

.shutter-btn {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  width: 80px; height: 80px;
  border-radius: 50%;
  border: 4px solid var(--cream);
  background: transparent;
  cursor: pointer;
  transition: all 0.2s;
}
.shutter-btn::after {
  content: '';
  position: absolute; inset: 6px;
  border-radius: 50%;
  background: var(--shutter-red);
  transition: all 0.15s;
}
.shutter-btn:hover { border-color: var(--gold); }
.shutter-btn:hover::after { background: #e74c3c; }
.shutter-btn:active::after { transform: scale(0.9); }
.shutter-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.camera-select {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 10;
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(245,240,232,0.2);
  color: var(--cream);
  padding: 8px 12px;
  border-radius: 8px;
  font-family: 'Courier New', monospace;
  font-size: 0.8rem;
  max-width: 200px;
}

/* ── Review ── */
#reviewScreen { gap: 24px; }

.strip-preview {
  background: var(--strip-bg);
  padding: 16px 16px 16px;
  border-radius: 4px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  display: flex; flex-direction: column;
  align-items: center; gap: 10px;
  max-height: 80vh;
  overflow-y: auto;
}
.strip-preview .strip-footer-img {
  width: min(240px, 60vw);
  border-radius: 2px;
  display: block;
}
.strip-preview .strip-banner-img {
  width: min(240px, 60vw);
  border-radius: 2px;
}
.strip-preview .photo-frame {
  width: min(240px, 60vw);
  aspect-ratio: 4/3;
  border-radius: 2px;
  overflow: hidden;
  background: #ddd;
}
.strip-preview .photo-frame img {
  width: 100%; height: 100%;
  object-fit: cover;
  filter: contrast(1.05) saturate(1.05) sepia(0.05);
}
.strip-preview .strip-date {
  font-family: 'Courier New', monospace;
  font-size: 0.7rem;
  color: #7B2D26;
  letter-spacing: 0.08em;
}

.review-actions {
  display: flex; gap: 16px; flex-wrap: wrap;
  justify-content: center;
}

/* ── Editor ── */
#editorScreen {
  flex-direction: row;
  gap: 0; padding: 0;
}

.editor-sidebar {
  width: 220px; height: 100%;
  background: #5BC4BE;
  border-right: 2px solid #4AADA8;
  display: flex; flex-direction: column;
  padding: 16px; gap: 12px;
  overflow-y: auto; flex-shrink: 0;
}
.editor-sidebar h3 {
  font-family: Georgia, serif;
  font-size: 1rem;
  color: #7B2D26;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.sticker-palette {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.sticker-palette .sticker-item {
  width: 56px; height: 56px;
  background: rgba(255,255,255,0.25);
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  cursor: grab; transition: all 0.15s;
  padding: 6px;
  overflow: hidden;
}
.sticker-palette .sticker-item:hover {
  background: rgba(255,255,255,0.45);
  border-color: #fff;
  transform: scale(1.08);
}
.sticker-palette .sticker-item img {
  width: 100%; height: 100%;
  object-fit: contain;
  pointer-events: none;
}
.sticker-palette .sticker-item--upload {
  border-style: dashed;
  font-size: 1.6rem;
  color: #7B2D26;
}

.editor-controls {
  display: flex; flex-direction: column; gap: 8px;
  margin-top: auto;
}
.editor-controls .btn { width: 100%; font-size: 0.85rem; padding: 10px 12px; }

.editor-main {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; overflow: auto;
  position: relative;
}

.editor-strip-container {
  position: relative;
  background: var(--strip-bg);
  padding: 16px 16px 16px;
  border-radius: 4px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  display: flex; flex-direction: column;
  align-items: center; gap: 10px;
  user-select: none; -webkit-user-select: none;
}
.editor-strip-container .strip-footer-img {
  width: 280px;
  border-radius: 2px;
  display: block;
  pointer-events: none;
}
.editor-strip-container .strip-banner-img {
  width: 280px;
  border-radius: 2px;
  pointer-events: none;
}
.editor-strip-container .photo-frame {
  width: 280px;
  aspect-ratio: 4/3;
  border-radius: 2px;
  overflow: hidden;
  pointer-events: none;
}
.editor-strip-container .photo-frame img {
  width: 100%; height: 100%;
  object-fit: cover;
  filter: contrast(1.05) saturate(1.05) sepia(0.05);
  pointer-events: none;
}
.editor-strip-container .strip-date {
  font-family: 'Courier New', monospace;
  font-size: 0.7rem;
  color: #7B2D26;
  letter-spacing: 0.08em;
  pointer-events: none;
}

/* Sticker layer */
.sticker-layer {
  position: absolute; inset: 0;
  overflow: hidden;
}
.placed-sticker {
  position: absolute;
  cursor: move;
  user-select: none; -webkit-user-select: none;
  touch-action: none;
}
.placed-sticker img {
  width: 100%; height: 100%;
  pointer-events: none; display: block;
  object-fit: contain;
}
.placed-sticker.selected {
  outline: 2px dashed var(--gold);
  outline-offset: 4px;
}
.sticker-handle {
  position: absolute;
  width: 18px; height: 18px;
  background: var(--gold);
  border: 2px solid white;
  border-radius: 50%;
  cursor: pointer; z-index: 10;
  touch-action: none;
}
.sticker-handle--resize {
  bottom: -9px; right: -9px;
  cursor: nwse-resize;
}
.sticker-handle--rotate {
  top: -24px; left: 50%;
  transform: translateX(-50%);
  cursor: grab;
  background: var(--accent-pink);
}
.sticker-handle--rotate::before {
  content: '';
  position: absolute;
  top: 100%; left: 50%;
  width: 1px; height: 15px;
  background: rgba(232,67,147,0.5);
  transform: translateX(-50%);
}

/* ── Done ── */
#doneScreen { gap: 24px; text-align: center; }
.done-title {
  font-family: Georgia, serif;
  font-size: clamp(1.8rem, 5vw, 2.8rem);
  color: #E8C47A;
  text-shadow: 2px 2px 0 #7B2D26;
}
.done-strip-preview {
  max-height: 55vh;
  border-radius: 4px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.done-actions {
  display: flex; gap: 16px; flex-wrap: wrap;
  justify-content: center;
}

/* Drag ghost */
.drag-ghost {
  position: fixed; z-index: 10000;
  pointer-events: none; opacity: 0.8;
  width: 60px; height: 60px;
}
.drag-ghost img {
  width: 100%; height: 100%;
  object-fit: contain;
}

/* Mobile */
@media (max-width: 700px) {
  #editorScreen { flex-direction: column; }
  .editor-sidebar {
    width: 100%; height: auto;
    flex-direction: row; flex-wrap: wrap;
    align-items: center;
    border-right: none;
    border-bottom: 2px solid #4AADA8;
    padding: 10px; gap: 8px;
    overflow-y: visible; overflow-x: auto;
  }
  .editor-sidebar h3 { display: none; }
  .sticker-palette { display: flex; flex-wrap: nowrap; gap: 6px; }
  .sticker-palette .sticker-item { width: 44px; height: 44px; flex-shrink: 0; }
  .editor-controls { flex-direction: row; margin-top: 0; }
  .editor-controls .btn { width: auto; }
  .editor-strip-container .photo-frame { width: 200px; }
  .editor-strip-container .strip-banner-img { width: 200px; }
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); border: 0;
}
</style>
</head>
<body>

<!-- ═══ Screen 1: Welcome ═══ -->
<div id="welcomeScreen" class="screen is-active">
  <div class="marquee-bulbs">
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
  </div>
  <img class="welcome-banner" id="welcomeBanner" alt="Creative Fair">
  <p class="marquee-subtitle">Strike a pose &bull; 3 shots &bull; Instant strip</p>
  <button class="btn btn--solid" id="startBtn">Start</button>
</div>

<!-- ═══ Screen 2: Camera ═══ -->
<div id="cameraScreen" class="screen">
  <div class="camera-viewport">
    <video id="cameraVideo" autoplay playsinline muted></video>
    <div class="countdown-display" id="countdown"></div>
    <div class="flash-overlay" id="flash"></div>
  </div>
  <div class="camera-controls">
    <p class="photo-counter" id="photoCounter">Photo 1 of 3</p>
  </div>
  <button class="shutter-btn" id="shutterBtn" title="Take photo"></button>
  <select class="camera-select" id="cameraSelect" title="Choose camera"></select>
</div>

<!-- ═══ Screen 3: Review ═══ -->
<div id="reviewScreen" class="screen">
  <div class="strip-preview" id="reviewStrip">
    <img class="strip-banner-img" id="reviewBanner" alt="Creative Fair">
    <div class="photo-frame"><img id="reviewPhoto1" alt="Photo 1"></div>
    <div class="photo-frame"><img id="reviewPhoto2" alt="Photo 2"></div>
    <div class="photo-frame"><img id="reviewPhoto3" alt="Photo 3"></div>
    <img class="strip-footer-img" id="reviewFooter" alt="">
    <div class="strip-date" id="reviewDate"></div>
  </div>
  <div class="review-actions">
    <button class="btn btn--small" id="retakeBtn">Retake</button>
    <button class="btn btn--small btn--solid" id="addStickersBtn">Add Stickers</button>
    <button class="btn btn--small" id="skipToDownloadBtn">Download As Is</button>
  </div>
</div>

<!-- ═══ Screen 4: Sticker Editor ═══ -->
<div id="editorScreen" class="screen">
  <div class="editor-sidebar">
    <h3>Stickers</h3>
    <div class="sticker-palette" id="stickerPalette"></div>
    <div class="editor-controls">
      <button class="btn btn--small" id="undoStickerBtn">Undo</button>
      <button class="btn btn--small" id="clearStickersBtn">Clear All</button>
      <button class="btn btn--small btn--solid" id="editorDoneBtn">Done</button>
    </div>
  </div>
  <div class="editor-main" id="editorMain">
    <div class="editor-strip-container" id="editorStrip">
      <img class="strip-banner-img" id="editorBanner" alt="Creative Fair">
      <div class="photo-frame"><img id="editorPhoto1" alt="Photo 1"></div>
      <div class="photo-frame"><img id="editorPhoto2" alt="Photo 2"></div>
      <div class="photo-frame"><img id="editorPhoto3" alt="Photo 3"></div>
      <img class="strip-footer-img" id="editorFooter" alt="">
      <div class="strip-date" id="editorDate"></div>
      <div class="sticker-layer" id="stickerLayer"></div>
    </div>
  </div>
</div>

<!-- ═══ Screen 5: Done ═══ -->
<div id="doneScreen" class="screen">
  <h2 class="done-title">Your Photo Strip!</h2>
  <img class="done-strip-preview" id="donePreview" alt="Final photo strip">
  <div class="done-actions">
    <button class="btn btn--solid" id="downloadBtn">Download</button>
    <button class="btn" id="printBtn">Print</button>
    <button class="btn btn--small" id="newSessionBtn">New Session</button>
  </div>
</div>

<input type="file" id="customStickerInput" accept="image/*" class="sr-only">
<canvas id="captureCanvas" style="display:none"></canvas>

// ── roundRect polyfill for older Safari ──
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    const [tl, tr, br, bl] = r;
    this.moveTo(x + tl, y);
    this.lineTo(x + w - tr, y);
    this.quadraticCurveTo(x + w, y, x + w, y + tr);
    this.lineTo(x + w, y + h - br);
    this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
    this.lineTo(x + bl, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - bl);
    this.lineTo(x, y + tl);
    this.quadraticCurveTo(x, y, x + tl, y);
    this.closePath();
  };
}

function setView(name) {
  state.view = name;
  Object.entries(screens).forEach(([key, screenEl]) => {

  });
}

function formatDate() {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${mm}.${dd}.${d.getFullYear()}`;
}

async function enumerateCameras() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const videoDevices = devices.filter(d => d.kind === 'videoinput');
    el.cameraSelect.innerHTML = '';
    videoDevices.forEach((d, i) => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.textContent = d.label || `Camera ${i + 1}`;
      el.cameraSelect.appendChild(opt);
    });
    if (videoDevices.length <= 1) {
      el.cameraSelect.style.display = 'none';
    } else {
      el.cameraSelect.style.display = '';
    }
  } catch (e) {}
}

async function startCamera(deviceId) {
  try {
    const constraints = {
      video: {
        width: { ideal: 1280 }, height: { ideal: 960 },
      },
      audio: false,
    };
    if (deviceId) {
      constraints.video.deviceId = { exact: deviceId };
    } else {
      constraints.video.facingMode = 'user';
    }
    if (state.stream) {
      state.stream.getTracks().forEach(t => t.stop());
    }
    state.stream = await navigator.mediaDevices.getUserMedia(constraints);
    el.cameraVideo.srcObject = state.stream;
    await enumerateCameras();
  } catch (err) {
    alert('Could not access camera. Please allow camera permissions and try again.');
    setView('welcome');
  }
}

function stopCamera() {
  if (state.stream) {
    state.stream.getTracks().forEach(t => t.stop());
    state.stream = null;
    el.cameraVideo.srcObject = null;
  }
}

el.cameraSelect.addEventListener('change', () => {
  startCamera(el.cameraSelect.value);
});

function captureFrame() {
  const video = el.cameraVideo;
  const canvas = el.captureCanvas;
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = 'rgba(255, 245, 230, 0.08)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.globalCompositeOperation = 'source-over';
  return canvas.toDataURL('image/jpeg', 0.92);
}

function doFlash() {
  el.flash.classList.add('flash');
  setTimeout(() => el.flash.classList.remove('flash'), 150);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function startCaptureSequence() {
  if (state.capturing) return;
  state.capturing = true;
  el.shutterBtn.disabled = true;
  state.photos = [];
  state.dateStr = formatDate();

  for (let shot = 0; shot < 3; shot++) {
    el.photoCounter.textContent = `Photo ${shot + 1} of 3`;
    for (let n = 3; n >= 1; n--) {
      el.countdown.textContent = n;
      el.countdown.classList.add('visible');
      await sleep(800);
    }
    el.countdown.classList.remove('visible');
    doFlash();
    await sleep(100);
    state.photos.push(captureFrame());
    if (shot < 2) await sleep(600);
  }

  state.capturing = false;
  el.shutterBtn.disabled = false;
  stopCamera();
  showReview();
}

// ══════════════════════════════════════════

function showReview() {
  document.getElementById('reviewPhoto1').src = state.photos[0];
  document.getElementById('reviewPhoto2').src = state.photos[1];
  document.getElementById('reviewPhoto3').src = state.photos[2];
  el.reviewDate.textContent = state.dateStr;
  setView('review');
}

// ══════════════════════════════════════════
// STICKER EDITOR
// ══════════════════════════════════════════

function initStickerPalette() {
  el.stickerPalette.innerHTML = '';
  IMG_STICKERS.forEach(item => {
    const div = document.createElement('div');
    div.className = 'sticker-item';
    div.title = item.label;
    div.dataset.stickerId = item.id;
    const img = document.createElement('img');
    img.src = item.src;
    img.alt = item.label;
    img.draggable = false;
    div.appendChild(img);
    div.addEventListener('pointerdown', onPaletteDragStart);
    div.addEventListener('click', () => {
      if (!div._dragged) {
        placeSticker({ type: 'image', src: item.src });
      }
      div._dragged = false;
    });
    el.stickerPalette.appendChild(div);
  });

  const uploadDiv = document.createElement('div');
  uploadDiv.className = 'sticker-item sticker-item--upload';
  uploadDiv.title = 'Upload custom sticker';
  uploadDiv.textContent = '+';
  uploadDiv.addEventListener('click', () => el.customStickerInput.click());
  el.stickerPalette.appendChild(uploadDiv);
}

function openEditor() {
  document.getElementById('editorPhoto1').src = state.photos[0];
  document.getElementById('editorPhoto2').src = state.photos[1];
  document.getElementById('editorPhoto3').src = state.photos[2];
  el.editorDate.textContent = state.dateStr;
  state.stickers = [];
  state.undoStack = [];
  state.selectedStickerId = null;
  renderStickers();
  setView('editor');
}

function placeSticker(opts) {
  pushUndo();
  const strip = el.editorStrip;
  const rect = strip.getBoundingClientRect();
  const size = 70;
  const sticker = {
    id: ++state.stickerIdCounter,
    type: 'image',
    src: opts.src,
    x: (rect.width / 2) - (size / 2),
    y: (rect.height / 2) - (size / 2),
    w: size, h: size,
    rotation: 0,
  };
  state.stickers.push(sticker);
  state.selectedStickerId = sticker.id;
  renderStickers();
}

function renderStickers() {
  el.stickerLayer.innerHTML = '';
  state.stickers.forEach(s => {
    const div = document.createElement('div');
    div.className = 'placed-sticker' + (s.id === state.selectedStickerId ? ' selected' : '');
    div.dataset.stickerId = s.id;
    div.style.left = s.x + 'px';
    div.style.top = s.y + 'px';
    div.style.width = s.w + 'px';
    div.style.height = s.h + 'px';
    div.style.transform = `rotate(${s.rotation}deg)`;

    const img = document.createElement('img');
    img.src = s.src;
    img.draggable = false;
    div.appendChild(img);

    if (s.id === state.selectedStickerId) {
      const resizeHandle = document.createElement('div');
      resizeHandle.className = 'sticker-handle sticker-handle--resize';
      resizeHandle.addEventListener('pointerdown', onResizeStart);
      div.appendChild(resizeHandle);

      const rotateHandle = document.createElement('div');
      rotateHandle.className = 'sticker-handle sticker-handle--rotate';
      rotateHandle.addEventListener('pointerdown', onRotateStart);
      div.appendChild(rotateHandle);
    }

    div.addEventListener('pointerdown', onStickerPointerDown);
    div.addEventListener('dblclick', () => deleteSticker(s.id));
    el.stickerLayer.appendChild(div);
  });
}

function pushUndo() {
  state.undoStack.push(JSON.parse(JSON.stringify(state.stickers)));
  if (state.undoStack.length > 30) state.undoStack.shift();
}

function undoSticker() {
  if (!state.undoStack.length) return;
  state.stickers = state.undoStack.pop();
  state.selectedStickerId = null;
  renderStickers();
}

function clearAllStickers() {
  if (!state.stickers.length) return;
  pushUndo();
  state.stickers = [];
  state.selectedStickerId = null;
  renderStickers();
}

function deleteSticker(id) {
  pushUndo();
  state.stickers = state.stickers.filter(s => s.id !== id);
  if (state.selectedStickerId === id) state.selectedStickerId = null;
  renderStickers();
}

// ══════════════════════════════════════════
// DRAG & DROP (Pointer Events)
// ══════════════════════════════════════════

let dragState = null;

function onPaletteDragStart(e) {
  e.preventDefault();
  const item = e.currentTarget;
  item._dragged = false;
  const src = item.querySelector('img')?.src;
  if (!src) return;

  const ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  const gImg = document.createElement('img');
  gImg.src = src;
  ghost.appendChild(gImg);
  document.body.appendChild(ghost);
  ghost.style.left = (e.clientX - 30) + 'px';
  ghost.style.top = (e.clientY - 30) + 'px';

  dragState = { mode: 'palette-drag', src, ghost, startX: e.clientX, startY: e.clientY, item };
  document.addEventListener('pointermove', onPaletteDragMove);
  document.addEventListener('pointerup', onPaletteDragEnd);
}

function onPaletteDragMove(e) {
  if (!dragState || dragState.mode !== 'palette-drag') return;
  dragState.ghost.style.left = (e.clientX - 30) + 'px';
  dragState.ghost.style.top = (e.clientY - 30) + 'px';
  if (Math.abs(e.clientX - dragState.startX) > 5 || Math.abs(e.clientY - dragState.startY) > 5) {
    dragState.item._dragged = true;
  }
}

function onPaletteDragEnd(e) {
  if (!dragState || dragState.mode !== 'palette-drag') return;
  document.removeEventListener('pointermove', onPaletteDragMove);
  document.removeEventListener('pointerup', onPaletteDragEnd);
  dragState.ghost.remove();

  const stripRect = el.editorStrip.getBoundingClientRect();
  if (e.clientX >= stripRect.left && e.clientX <= stripRect.right &&
      e.clientY >= stripRect.top && e.clientY <= stripRect.bottom) {
    pushUndo();
    const sticker = {
      id: ++state.stickerIdCounter,
      type: 'image',
      src: dragState.src,
      x: Math.max(0, Math.min(e.clientX - stripRect.left - 35, stripRect.width - 70)),
      y: Math.max(0, Math.min(e.clientY - stripRect.top - 35, stripRect.height - 70)),
      w: 70, h: 70, rotation: 0,
    };
    state.stickers.push(sticker);
    state.selectedStickerId = sticker.id;
    renderStickers();
  }
  dragState = null;
}

function onStickerPointerDown(e) {
  if (e.target.classList.contains('sticker-handle')) return;
  e.preventDefault(); e.stopPropagation();
  const id = Number(e.currentTarget.dataset.stickerId);
  state.selectedStickerId = id;
  renderStickers();
  const s = state.stickers.find(st => st.id === id);
  if (!s) return;
  const startX = e.clientX, startY = e.clientY;
  const origX = s.x, origY = s.y;
  let moved = false;

  function onMove(ev) {
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    if (!moved && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) { moved = true; pushUndo(); }
    if (moved) {
      s.x = origX + dx; s.y = origY + dy;
      const el = document.querySelector(`.placed-sticker[data-sticker-id="${id}"]`);
      if (el) { el.style.left = s.x + 'px'; el.style.top = s.y + 'px'; }
    }
  }
  function onUp() {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    if (moved) renderStickers();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function onResizeStart(e) {
  e.preventDefault(); e.stopPropagation();
  const id = state.selectedStickerId;
  const s = state.stickers.find(st => st.id === id);
  if (!s) return;
  pushUndo();
  const startX = e.clientX, startY = e.clientY;
  const origW = s.w, origH = s.h;

  function onMove(ev) {
    const delta = ((ev.clientX - startX) + (ev.clientY - startY)) / 2;
    s.w = Math.max(30, origW + delta);
    s.h = Math.max(30, origH + delta);
    const el = document.querySelector(`.placed-sticker[data-sticker-id="${id}"]`);
    if (el) { el.style.width = s.w + 'px'; el.style.height = s.h + 'px'; }
  }
  function onUp() {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    renderStickers();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function onRotateStart(e) {
  e.preventDefault(); e.stopPropagation();
  const id = state.selectedStickerId;
  const s = state.stickers.find(st => st.id === id);
  if (!s) return;
  pushUndo();
  const stickerEl = document.querySelector(`.placed-sticker[data-sticker-id="${id}"]`);
  const rect = stickerEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;

  function onMove(ev) {
    const angle = Math.atan2(ev.clientY - cy, ev.clientX - cx);
    s.rotation = Math.round((angle * 180 / Math.PI) + 90);
    if (stickerEl) stickerEl.style.transform = `rotate(${s.rotation}deg)`;
  }
  function onUp() {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    renderStickers();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

el.stickerLayer.addEventListener('pointerdown', (e) => {
  if (e.target === el.stickerLayer) {
    state.selectedStickerId = null;
    renderStickers();
  }
});

el.customStickerInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => placeSticker({ type: 'image', src: ev.target.result });
  reader.readAsDataURL(file);
  e.target.value = '';
});

document.addEventListener('keydown', (e) => {
  if (state.view !== 'editor') return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && state.selectedStickerId != null) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
    deleteSticker(state.selectedStickerId);
  }
});

// ══════════════════════════════════════════
// CANVAS RENDERING
// ══════════════════════════════════════════

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function renderStripToCanvas() {
  const scale = 2;
  const photoW = 560;
  const photoH = 420;
  const padding = 24;
  const gap = 16;

  // Load banner and footer to compute heights proportionally
  const bannerImg = await loadImage(ASSETS.stripBanner);
  const bannerH = Math.round(photoW * (bannerImg.height / bannerImg.width));
  const footerImg = await loadImage(ASSETS.stripFooter);
  const footerH = Math.round(photoW * (footerImg.height / footerImg.width));
  const stripW = photoW + padding * 2;

  const stripH = padding + bannerH + gap + (photoH + gap) * 3 + footerH + gap + 24 + padding;

  const canvas = document.createElement('canvas');
  canvas.width = stripW * scale;
  canvas.height = stripH * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  // White strip background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, stripW, stripH);

  // Banner at top
  let yPos = padding;
  ctx.drawImage(bannerImg, padding, yPos, photoW, bannerH);
  yPos += bannerH + gap;

  // Three photos
  for (let i = 0; i < 3; i++) {
    const img = await loadImage(state.photos[i]);
    const x = padding;
    const y = yPos + i * (photoH + gap);
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(x, y, photoW, photoH, 4);
    ctx.clip();
    const imgRatio = img.width / img.height;
    const frameRatio = photoW / photoH;
    let sx = 0, sy = 0, sw = img.width, sh = img.height;
    if (imgRatio > frameRatio) { sw = img.height * frameRatio; sx = (img.width - sw) / 2; }
    else { sh = img.width / frameRatio; sy = (img.height - sh) / 2; }
    ctx.drawImage(img, sx, sy, sw, sh, x, y, photoW, photoH);
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgba(255, 248, 235, 0.1)';
    ctx.fillRect(x, y, photoW, photoH);
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
  }

  // Footer image — same width as photos
  const footerY = yPos + (photoH + gap) * 3;
  ctx.drawImage(footerImg, padding, footerY, photoW, footerH);

  // Date stamp (under footer)
  ctx.fillStyle = '#7B2D26';
  ctx.font = '13px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(state.dateStr, stripW / 2, footerY + footerH + gap + 4);

  // Stickers
  const stripEl = el.editorStrip;
  const domW = stripEl.offsetWidth || stripW;
  const domH = stripEl.offsetHeight || stripH;
  const scaleX = stripW / domW;
  const scaleY = stripH / domH;

  for (const s of state.stickers) {
    const img = await loadImage(s.src);
    const cxS = s.x + s.w / 2;
    const cyS = s.y + s.h / 2;
    ctx.save();
    ctx.translate(cxS * scaleX, cyS * scaleY);
    ctx.rotate(s.rotation * Math.PI / 180);
    ctx.drawImage(img, -(s.w * scaleX) / 2, -(s.h * scaleY) / 2, s.w * scaleX, s.h * scaleY);
    ctx.restore();
  }

  return canvas;
}

// ══════════════════════════════════════════
// DOWNLOAD + PRINT
// ══════════════════════════════════════════

async function downloadStrip() {
  const canvas = await renderStripToCanvas();
  const link = document.createElement('a');
  link.download = `creative-fair-${state.dateStr.replace(/\./g, '-')}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function printStrip() {
  const src = el.donePreview.src;
  const win = window.open('', '_blank');
  win.document.write(`<!DOCTYPE html><html><head><title>Photo Strip</title>
    <style>body{margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh}
    img{max-width:100%;max-height:100vh}@media print{body{margin:0}img{max-height:none;width:300px}}</style>
    </head><body><img src="${src}" onload="window.print()"></body></html>`);
  win.document.close();
}

async function goToDone() {
  state.selectedStickerId = null;
  renderStickers();
  const canvas = await renderStripToCanvas();
  el.donePreview.src = canvas.toDataURL('image/png');
  setView('done');
}

async function skipToDownload() {
  state.stickers = [];
  const canvas = await renderStripToCanvas();
  el.donePreview.src = canvas.toDataURL('image/png');
  setView('done');
}

el.startBtn.addEventListener('click', async () => {
  setView('camera');
  await startCamera();
});

el.shutterBtn.addEventListener('click', () => startCaptureSequence());

el.retakeBtn.addEventListener('click', () => {
  state.photos = [];
  el.photoCounter.textContent = 'Photo 1 of 3';
  setView('camera');
  startCamera();
});

el.addStickersBtn.addEventListener('click', () => openEditor());

el.skipToDownloadBtn.addEventListener('click', () => {
  stopCamera();
  skipToDownload();
});

el.undoStickerBtn.addEventListener('click', undoSticker);
el.clearStickersBtn.addEventListener('click', clearAllStickers);

el.editorDoneBtn.addEventListener('click', () => {
  stopCamera();
  goToDone();
});

el.downloadBtn.addEventListener('click', downloadStrip);
el.printBtn.addEventListener('click', printStrip);

el.newSessionBtn.addEventListener('click', () => {
  state.photos = [];
  state.stickers = [];
  state.undoStack = [];
  state.selectedStickerId = null;
  stopCamera();
  setView('welcome');
});

initStickerPalette();
setView('welcome');

</script>
